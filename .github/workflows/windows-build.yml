name: Build Himaya for Windows

on:
  push:
    branches: [ himaya-0.3-development ]
  pull_request:
    branches: [ himaya-0.3-development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Validate canonical source tree
        shell: pwsh
        run: |
          $required = @(
            "CMakeLists.txt",
            "App/main.cpp",
            "App/MainWindow.cpp",
            "Core/ConfigStore.cpp",
            "Core/WebsiteBlocker.cpp",
            "Core/ExecutionPolicy.cpp",
            "Service/service_main.cpp",
            "Installer/Himaya.iss",
            "NativeHost/native_host.cpp",
            "BrowserExtension/manifest.json",
            "BrowserExtension/content.js",
            "BrowserExtension/popup.js",
            "BrowserExtension/popup.html"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required source file missing: $file" }
          }
          Write-Host "Canonical source validated from repository root."
          $manifest = Get-Content "BrowserExtension/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3 -or !$manifest.key) { throw "Browser extension manifest is invalid." }
          node --check "BrowserExtension/background.js"
          if ($LASTEXITCODE -ne 0) { throw "Browser extension background script syntax check failed." }
          node --check "BrowserExtension/content.js"
          if ($LASTEXITCODE -ne 0) { throw "Browser extension content script syntax check failed." }
          node --check "BrowserExtension/popup.js"
          if ($LASTEXITCODE -ne 0) { throw "Browser extension popup script syntax check failed." }

      - name: Validate embedded DNS PowerShell syntax
        shell: pwsh
        run: |
          $source = Get-Content "Core/DnsProtection.cpp" -Raw
          $matches = [regex]::Matches(
            $source,
            'LR"PS\((?<script>.*?)\)PS";',
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )
          if ($matches.Count -ne 5) { throw "Expected exactly five embedded DNS PowerShell script parts." }
          $scriptText = ($matches | ForEach-Object { $_.Groups["script"].Value }) -join ""
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $scriptText,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String -Width 4096 | Write-Host
            throw "Embedded DNS PowerShell syntax validation failed."
          }
          if ($scriptText.IndexOf("Get-AddressFamilyName") -lt 0 -or
              $scriptText.IndexOf("'^(2|IPv4|InterNetwork)$'") -lt 0) {
            throw "DNS address-family normalization is missing."
          }
          if ($scriptText -match 'Set-DnsClientServerAddress[^\r\n]*-AddressFamily') {
            throw "Unsupported -AddressFamily parameter found on Set-DnsClientServerAddress."
          }
          if ($scriptText -match 'Get-NetAdapter[^\r\n]*-InterfaceIndex') {
            throw "Unsupported -InterfaceIndex parameter found on Get-NetAdapter."
          }
          if ($scriptText.IndexOf("Repairing empty legacy backup") -lt 0) {
            throw "Safe migration for the previous empty DNS backup is missing."
          }
          if ($scriptText.IndexOf("Automatic rollback skipped because the backup is legacy") -lt 0) {
            throw "Rollback must preserve an unvalidated legacy backup."
          }
          if ($scriptText.IndexOf("function Test-DnsResolverGroup") -lt 0 -or
              $scriptText.IndexOf('Resolve-DnsName -Name ''example.com'' -Server $server -Type A -DnsOnly') -lt 0) {
            throw "Live DNS resolver health verification is missing."
          }
          if ($scriptText.IndexOf("function Ensure-HimayaFirewallRule") -lt 0 -or
              $scriptText.IndexOf("Get-NetFirewallPortFilter -AssociatedNetFirewallRule") -lt 0 -or
              $scriptText.IndexOf("Get-NetFirewallAddressFilter -AssociatedNetFirewallRule") -lt 0) {
            throw "Firewall rule configuration verification is missing."
          }
          if ($scriptText.IndexOf("Restored and verified static") -lt 0) {
            throw "DNS restore read-back verification is missing."
          }
          Write-Host "Embedded DNS PowerShell parsed successfully; DNS health, firewall verification and restore checks are present; no live DNS settings were changed."

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify application and service executables
        shell: pwsh
        run: |
          foreach ($exe in @("build/bin/Himaya.exe","build/bin/HimayaGuard.exe","build/bin/HimayaNativeHost.exe")) {
            if (!(Test-Path $exe)) { throw "Expected executable was not generated: $exe" }
            $item = Get-Item $exe
            if ($item.Length -lt 16384) { throw "Executable is unexpectedly small ($($item.Length) bytes)." }
            $item | Format-List FullName,Length,LastWriteTime
            Get-FileHash -Algorithm SHA256 $exe | Format-List
          }

      - name: Test Windows AppLocker enforcement and restore
        shell: pwsh
        run: |
          & ".\\build\\bin\\HimayaPolicySmokeTest.exe"
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Host "===== Local AppLocker policy ====="
            try { Get-AppLockerPolicy -Local -Xml | Out-String -Width 4096 | Write-Host } catch { Write-Host $_ }
            try { Get-AppLockerPolicy -Local | Format-List * | Out-String -Width 4096 | Write-Host } catch { Write-Host $_ }
            Write-Host "===== Effective AppLocker policy ====="
            try { Get-AppLockerPolicy -Effective -Xml | Out-String -Width 4096 | Write-Host } catch { Write-Host $_ }
            Write-Host "===== AppLocker policy registry ====="
            try { Get-ChildItem "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\SrpV2" -Recurse -ErrorAction Stop | Format-List Name,Property | Out-String -Width 4096 | Write-Host } catch { Write-Host $_ }
            Write-Host "===== AppLocker service state ====="
            Get-Service AppIDSvc,AppLockerFltr -ErrorAction SilentlyContinue | Format-List Name,Status,StartType
            foreach ($channel in @(
              "Microsoft-Windows-AppLocker/EXE and DLL",
              "Microsoft-Windows-AppLocker/MSI and Script"
            )) {
              Write-Host "===== Recent events: $channel ====="
              try {
                Get-WinEvent -FilterHashtable @{LogName=$channel; StartTime=(Get-Date).AddMinutes(-10)} -MaxEvents 40 -ErrorAction Stop |
                  Select-Object TimeCreated,Id,LevelDisplayName,Message | Format-List
              } catch { Write-Host "Could not read channel: $_" }
            }
            throw "Windows AppLocker enforcement smoke test failed with exit code $testExit."
          }

      - name: Test background Windows service startup
        shell: pwsh
        run: |
          $serviceExe = (Resolve-Path ".\\build\\bin\\HimayaGuard.exe").Path
          $binPath = '"' + $serviceExe + '"'
          & sc.exe create HimayaGuard binPath= $binPath start= demand
          if ($LASTEXITCODE -ne 0) { throw "Could not register HimayaGuard for the service smoke test." }
          try {
            & sc.exe start HimayaGuard
            if ($LASTEXITCODE -ne 0) { throw "HimayaGuard failed to start." }
            Start-Sleep -Seconds 3
            $state = (& sc.exe query HimayaGuard) -join "`n"
            if ($state -notmatch "RUNNING") { throw "HimayaGuard did not reach RUNNING state: $state" }
          }
          finally {
            & sc.exe stop HimayaGuard | Out-Null
            Start-Sleep -Seconds 2
            & sc.exe delete HimayaGuard | Out-Null
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "Installer\Himaya.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "Installer/Output/Himaya-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer was not generated: $installer" }
          Get-Item $installer | Format-List FullName,Length
          Get-FileHash -Algorithm SHA256 $installer | Format-List

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Himaya-Windows-x64-v0.7.0
          path: |
            build/bin/Himaya.exe
            build/bin/HimayaGuard.exe
            build/bin/HimayaNativeHost.exe
            Installer/Output/Himaya-Setup.exe
          if-no-files-found: error
          retention-days: 30
