name: Build Himaya for Windows

on:
  push:
    branches: [ himaya-0.3-development ]
  pull_request:
    branches: [ himaya-0.3-development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Validate canonical source tree
        shell: pwsh
        run: |
          $required = @(
            "CMakeLists.txt",
            "App/main.cpp",
            "App/MainWindow.cpp",
            "Core/ConfigStore.cpp",
            "Core/WebsiteBlocker.cpp",
            "Core/ExecutionPolicy.cpp",
            "Service/service_main.cpp",
            "Installer/Himaya.iss"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required source file missing: $file" }
          }
          Write-Host "Canonical source validated from repository root."

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify application and service executables
        shell: pwsh
        run: |
          foreach ($exe in @("build/bin/Himaya.exe","build/bin/HimayaGuard.exe")) {
            if (!(Test-Path $exe)) { throw "Expected executable was not generated: $exe" }
            $item = Get-Item $exe
            if ($item.Length -lt 16384) { throw "Executable is unexpectedly small ($($item.Length) bytes)." }
            $item | Format-List FullName,Length,LastWriteTime
            Get-FileHash -Algorithm SHA256 $exe | Format-List
          }

      - name: Test Windows execution policy apply and restore
        shell: pwsh
        run: |
          & ".\\build\\bin\\HimayaPolicySmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows SRP policy smoke test failed with exit code $LASTEXITCODE." }

      - name: Test background Windows service startup
        shell: pwsh
        run: |
          $serviceExe = (Resolve-Path ".\\build\\bin\\HimayaGuard.exe").Path
          $binPath = '"' + $serviceExe + '"'
          & sc.exe create HimayaGuard binPath= $binPath start= demand
          if ($LASTEXITCODE -ne 0) { throw "Could not register HimayaGuard for the service smoke test." }
          try {
            & sc.exe start HimayaGuard
            if ($LASTEXITCODE -ne 0) { throw "HimayaGuard failed to start." }
            Start-Sleep -Seconds 3
            $state = (& sc.exe query HimayaGuard) -join "`n"
            if ($state -notmatch "RUNNING") { throw "HimayaGuard did not reach RUNNING state: $state" }
          }
          finally {
            & sc.exe stop HimayaGuard | Out-Null
            Start-Sleep -Seconds 2
            & sc.exe delete HimayaGuard | Out-Null
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "Installer\Himaya.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "Installer/Output/Himaya-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer was not generated: $installer" }
          Get-Item $installer | Format-List FullName,Length
          Get-FileHash -Algorithm SHA256 $installer | Format-List

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Himaya-Windows-x64-v0.6.0
          path: |
            build/bin/Himaya.exe
            build/bin/HimayaGuard.exe
            Installer/Output/Himaya-Setup.exe
          if-no-files-found: error
          retention-days: 30
