name: Build Himaya for Windows

on:
  push:
    branches: [ main, master, himaya-0.3-development ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Himaya source archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -File -Filter "Himaya-0.3.1-Source*.zip" |
            Select-Object -First 1

          if (!$archive) {
            throw "Himaya 0.3.1 source ZIP was not found in the repository root."
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "source" -Force

          $sourceDir = "source/Himaya-0.3.1"
          if (!(Test-Path "$sourceDir/CMakeLists.txt")) {
            throw "CMakeLists.txt was not found after extracting the source archive."
          }

          Write-Host "Source extracted to $sourceDir"

      - name: Configure CMake
        working-directory: source/Himaya-0.3.1
        run: cmake -S . -B build -A x64

      - name: Build Release
        working-directory: source/Himaya-0.3.1
        run: cmake --build build --config Release

      - name: Verify executable
        working-directory: source/Himaya-0.3.1
        shell: pwsh
        run: |
          $exe = "build/bin/Himaya.exe"
          if (!(Test-Path $exe)) { throw "Expected executable was not generated: $exe" }
          Get-Item $exe | Format-List FullName,Length

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        working-directory: source/Himaya-0.3.1
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "Installer\\Himaya.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (!(Test-Path "Installer/Output/Himaya-Setup.exe")) { throw "Installer was not generated." }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Himaya-Windows-x64-v0.3.1
          path: |
            source/Himaya-0.3.1/build/bin/Himaya.exe
            source/Himaya-0.3.1/Installer/Output/Himaya-Setup.exe
          if-no-files-found: error
