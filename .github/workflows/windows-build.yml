name: Build Himaya for Windows

on:
  push:
    branches: [ himaya-0.3-development ]
  pull_request:
    branches: [ himaya-0.3-development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Validate and extract canonical source archive
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -File -Filter "Himaya-0.3.1-Source*.zip")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Himaya 0.3.1 source archive; found $($archives.Count)."
          }
          $archive = $archives[0]
          Get-FileHash -Algorithm SHA256 $archive.FullName | Format-List
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "source" -Force

          $sourceDir = "source/Himaya-0.3.1"
          $required = @(
            "$sourceDir/CMakeLists.txt",
            "$sourceDir/App/main.cpp",
            "$sourceDir/App/MainWindow.cpp",
            "$sourceDir/Core/ConfigStore.cpp",
            "$sourceDir/Core/WebsiteBlocker.cpp",
            "$sourceDir/Installer/Himaya.iss"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required source file missing: $file" }
          }
          Write-Host "Canonical source validated at $sourceDir"

      - name: Configure x64 Release
        working-directory: source/Himaya-0.3.1
        run: cmake -S . -B build -A x64

      - name: Build Release
        working-directory: source/Himaya-0.3.1
        run: cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        working-directory: source/Himaya-0.3.1
        run: |
          $exe = "build/bin/Himaya.exe"
          if (!(Test-Path $exe)) { throw "Expected executable was not generated: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 16384) { throw "Executable is unexpectedly small ($($item.Length) bytes)." }
          $item | Format-List FullName,Length,LastWriteTime
          Get-FileHash -Algorithm SHA256 $exe | Format-List

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: source/Himaya-0.3.1
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "Installer\\Himaya.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "Installer/Output/Himaya-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer was not generated: $installer" }
          Get-Item $installer | Format-List FullName,Length
          Get-FileHash -Algorithm SHA256 $installer | Format-List

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Himaya-Windows-x64-v0.3.1
          path: |
            source/Himaya-0.3.1/build/bin/Himaya.exe
            source/Himaya-0.3.1/Installer/Output/Himaya-Setup.exe
          if-no-files-found: error
          retention-days: 30
